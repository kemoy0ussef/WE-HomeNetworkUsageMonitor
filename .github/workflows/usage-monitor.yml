name: Hourly WE Usage Snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-usage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript
        run: pnpm run build

      - name: Fetch and store usage snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SERVICE_NUMBER: ${{ secrets.SERVICE_NUMBER }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: node dist/index.js --no-interactive
